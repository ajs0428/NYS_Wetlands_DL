name: wetland-cnn
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pytorch>=2.0          # CPU build resolves automatically on a no-GPU node
  - torchvision
  - lightning>=2.1
  - rasterio>=1.3
  - geopandas
  - numpy>=1.24
  - pandas>=2.0
  - scipy
  - scikit-learn
  - matplotlib
  - tqdm
  - safetensors
  - shap
  - tensorboard
  - ipykernel
