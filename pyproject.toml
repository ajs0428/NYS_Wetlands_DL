[project]
name = "nys-wetlands-dl"
version = "0.1.0"
description = "U-Net wetland semantic segmentation for New York State"
requires-python = ">=3.11,<3.13"

dependencies = [
    # Core ML
    "torch>=2.0",
    "torchvision>=0.15",
    "lightning>=2.1",
    # Geospatial
    "rasterio>=1.3",
    "geopandas>=0.14",
    # Data / numerics
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    # Visualization
    "matplotlib>=3.7",
    # Utilities
    "tqdm>=4.60",
    "tensorboard>=2.20.0",
    # Model backbones
    "timm>=1.0.0",
]

[project.optional-dependencies]
# Extras not needed for core training/prediction
notebooks = [
    "ipykernel>=6.0",
    "shap>=0.42",
]

[tool.uv]
# On HPC with CUDA, override the PyTorch index:
# uv sync --extra-index-url https://download.pytorch.org/whl/cu121
